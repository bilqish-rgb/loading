<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lapor Warga</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
  html, body { height: 100%; margin: 0; }
  * { font-family: 'Poppins', sans-serif; }
  .slide-up { transform: translateY(100%); transition: transform 0.3s ease; }
  .slide-up.active { transform: translateY(0); }
  @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .card-anim { animation: fadeIn 0.3s ease forwards; }
  @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4), 0 0 40px rgba(239, 68, 68, 0.2); } 50% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.6), 0 0 60px rgba(239, 68, 68, 0.3); } }
  .fab-glow { animation: pulse-glow 2s ease-in-out infinite; }
  @keyframes slideInLeft { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
  .header-item { animation: slideInLeft 0.5s ease forwards; }
  .header-item:nth-child(2) { animation-delay: 0.1s; }
  @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
  .float-icon { animation: float 3s ease-in-out infinite; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .card-anim { animation: slideUp 0.4s ease forwards; }
  </style>
  <style>body { box-sizing: border-box; }</style>

 </head>
 <body class="h-full bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex justify-center items-center p-2">
  <div id="app-wrapper" class="w-full max-w-md h-full bg-slate-50 relative overflow-hidden flex flex-col shadow-2xl">
   <!-- Header with premium gradient -->
   <div id="header" class="bg-gradient-to-br from-red-600 via-red-500 to-orange-600 text-white px-6 py-10 flex items-center gap-4 shrink-0 shadow-2xl relative overflow-hidden">
    <div class="absolute top-0 right-0 w-40 h-40 bg-white/5 rounded-full -mr-20 -mt-10"></div>
    <div class="absolute bottom-0 left-0 w-32 h-32 bg-white/5 rounded-full -ml-16 -mb-16"></div><span class="text-5xl header-item float-icon relative z-10">🚨</span>
    <div class="header-item relative z-10">
     <h1 id="header-title" class="text-3xl font-bold tracking-tight">Lapor Warga</h1>
     <p class="text-sm text-red-100 font-medium mt-1">Laporkan Kejadian di Sekitarmu</p>
    </div>
   </div><!-- List with gradient background -->
   <div id="list" class="flex-1 overflow-y-auto p-5 space-y-4 bg-gradient-to-b from-slate-50 via-blue-50 to-slate-50"></div><!-- FAB Button with enhanced glow effect --> <button id="fab-btn" onclick="openPopup()" class="absolute bottom-8 right-8 w-20 h-20 rounded-full bg-gradient-to-br from-red-500 via-red-600 to-red-700 text-white shadow-2xl hover:scale-110 active:scale-95 transition-all flex items-center justify-center border-none z-10 fab-glow border-4 border-white/20 flex-shrink-0"> <i data-lucide="plus" class="w-8 h-8 font-bold"></i> </button> <!-- Overlay -->
   <div id="overlay" class="absolute inset-0 bg-black/40 z-20 hidden backdrop-blur-sm" onclick="closePopup()"></div><!-- Popup Form with modern design -->
   <div id="popup" class="slide-up absolute bottom-0 left-0 w-full bg-white rounded-t-3xl p-7 z-30 max-h-[90%] overflow-y-auto shadow-2xl border-t-4 border-red-500">
    <div class="flex items-center justify-between mb-6">
     <div>
      <h3 class="text-2xl font-bold text-slate-800">Buat Laporan</h3>
      <p class="text-sm text-slate-500 mt-1 font-medium">Bantu kami mengetahui kejadian yang terjadi</p>
     </div><button onclick="closePopup()" class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center border-none hover:bg-red-100 transition flex-shrink-0"> <i data-lucide="x" class="w-5 h-5 text-red-500"></i> </button>
    </div><!-- Form sections with icons -->
    <div class="space-y-5">
     <!-- Title -->
     <div>
      <label for="f-title" class="text-sm font-bold text-slate-700 mb-2.5 flex items-center gap-2.5 block">
       <div class="w-6 h-6 bg-red-100 rounded-lg flex items-center justify-center">
        <i data-lucide="type" class="w-4 h-4 text-red-600"></i>
       </div> Judul Kejadian </label> <input id="f-title" type="text" placeholder="Contoh: Kecelakaan di Jl. Merdeka" class="w-full px-4 py-3.5 rounded-2xl border-2 border-slate-200 text-sm outline-none focus:border-red-500 focus:bg-red-50 transition bg-slate-50 font-medium">
     </div><!-- Category -->
     <div>
      <label for="f-cat" class="text-sm font-bold text-slate-700 mb-2.5 flex items-center gap-2.5 block">
       <div class="w-6 h-6 bg-red-100 rounded-lg flex items-center justify-center">
        <i data-lucide="tag" class="w-4 h-4 text-red-600"></i>
       </div> Kategori </label> <select id="f-cat" class="w-full px-4 py-3.5 rounded-2xl border-2 border-slate-200 text-sm outline-none bg-slate-50 focus:border-red-500 focus:bg-red-50 transition font-medium"> <option value="Kecelakaan">🚗 Kecelakaan Lalu Lintas</option> <option value="Kebakaran">🔥 Kebakaran</option> <option value="Kriminal">⚠️ Kriminal</option> <option value="Banjir">💧 Banjir</option> <option value="Gempa">🌍 Gempa Bumi</option> <option value="Lainnya">📌 Lainnya</option> </select>
     </div><!-- Description -->
     <div>
      <label for="f-desc" class="text-sm font-bold text-slate-700 mb-2.5 flex items-center gap-2.5 block">
       <div class="w-6 h-6 bg-red-100 rounded-lg flex items-center justify-center">
        <i data-lucide="align-left" class="w-4 h-4 text-red-600"></i>
       </div> Deskripsi Detail </label> <textarea id="f-desc" rows="4" placeholder="Ceritakan apa yang terjadi, siapa yang terlibat, dan kondisi saat ini..." class="w-full px-4 py-3.5 rounded-2xl border-2 border-slate-200 text-sm outline-none resize-none focus:border-red-500 focus:bg-red-50 transition bg-slate-50 font-medium"></textarea>
     </div><!-- Image Upload -->
     <div>
      <label for="f-image" class="text-sm font-bold text-slate-700 mb-2.5 flex items-center gap-2.5 block">
       <div class="w-6 h-6 bg-red-100 rounded-lg flex items-center justify-center">
        <i data-lucide="camera" class="w-4 h-4 text-red-600"></i>
       </div> Foto Kejadian (Opsional) </label>
      <div class="relative">
       <input id="f-image" type="file" accept="image/*" class="w-full px-4 py-3.5 rounded-2xl border-2 border-dashed border-slate-300 text-sm outline-none focus:border-red-500 transition file:border-0 file:bg-red-50 file:text-red-600 file:font-bold file:rounded-lg file:px-3 file:py-2 file:cursor-pointer bg-slate-50">
      </div>
      <div id="image-preview" class="mt-4 hidden relative">
       <img id="preview-img" src="" class="w-full h-44 object-cover rounded-2xl shadow-lg border-2 border-slate-200"> <button type="button" onclick="clearImage()" class="absolute top-3 right-3 bg-red-500 text-white w-9 h-9 rounded-full flex items-center justify-center border-none text-sm hover:bg-red-600 transition shadow-lg"> <i data-lucide="x" class="w-5 h-5"></i> </button>
      </div>
     </div><!-- Location -->
     <div>
      <label for="f-loc" class="text-sm font-bold text-slate-700 mb-2.5 flex items-center gap-2.5 block">
       <div class="w-6 h-6 bg-red-100 rounded-lg flex items-center justify-center">
        <i data-lucide="map-pin" class="w-4 h-4 text-red-600"></i>
       </div> Lokasi Kejadian </label>
      <div class="flex gap-2">
       <input id="f-loc" type="text" placeholder="Nama jalan atau area..." class="flex-1 px-4 py-3.5 rounded-2xl border-2 border-slate-200 text-sm outline-none focus:border-red-500 focus:bg-red-50 transition bg-slate-50 font-medium"> <button onclick="getLocation()" class="px-5 py-3.5 rounded-2xl bg-red-50 text-red-600 text-sm font-bold border-2 border-red-200 hover:bg-red-100 transition shrink-0 flex items-center gap-1.5"> <i data-lucide="navigation" class="w-4 h-4"></i> GPS </button>
      </div>
     </div>
    </div><!-- Error message -->
    <div id="form-error" class="mt-5 p-4 bg-red-50 border-2 border-red-200 rounded-2xl text-red-700 text-sm font-semibold hidden flex items-center gap-3">
     <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i> <span id="error-text"></span>
    </div><!-- Submit Button --> <button id="submit-btn" onclick="addReport()" class="w-full mt-7 py-4 rounded-2xl bg-gradient-to-r from-red-500 to-red-600 text-white font-bold text-base border-none hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2.5 shadow-lg"> <i data-lucide="send" class="w-5 h-5"></i> Kirim Laporan </button>
   </div><!-- Delete confirmation modal -->
   <div id="delete-modal" class="absolute inset-0 bg-black/50 z-40 hidden items-center justify-center flex backdrop-blur-sm">
    <div class="bg-white rounded-2xl p-6 mx-6 w-full max-w-xs text-center shadow-2xl">
     <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3">
      <i data-lucide="trash-2" class="w-6 h-6 text-red-500"></i>
     </div>
     <p class="font-bold text-slate-800 mb-1">Hapus Laporan?</p>
     <p class="text-sm text-slate-500 mb-5">Tindakan ini tidak bisa dibatalkan.</p>
     <div class="flex gap-2">
      <button onclick="cancelDelete()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold border-none hover:bg-slate-200 transition">Batal</button> <button id="confirm-del-btn" onclick="confirmDelete()" class="flex-1 py-2.5 rounded-xl bg-red-500 text-white text-sm font-semibold border-none hover:bg-red-600 transition">Hapus</button>
     </div>
    </div>
   </div><!-- Toast notification -->
   <div id="toast" class="absolute top-20 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-5 py-3 rounded-full shadow-lg z-50 hidden transition-opacity flex items-center gap-2">
    <span id="toast-icon">✓</span> <span id="toast-text"></span>
   </div>
  </div>
  <script>
const categoryIcons = { Kecelakaan:'🚗', Kebakaran:'🔥', Kriminal:'⚠️', Banjir:'💧', Gempa:'🌍', Lainnya:'📌' };
let allReports = [];
let deleteTarget = null;
let selectedImageData = null;

const defaultConfig = {
  app_title: 'Lapor Warga',
  background_color: '#f1f5f9',
  surface_color: '#ffffff',
  text_color: '#1e293b',
  primary_color: '#ef4444',
  secondary_color: '#64748b',
  font_family: 'Poppins',
  font_size: 14
};

function saveToLocalStorage() {
  localStorage.setItem('lapor_warga_reports', JSON.stringify(allReports));
}

function loadFromLocalStorage() {
  const stored = localStorage.getItem('lapor_warga_reports');
  allReports = stored ? JSON.parse(stored) : [];
  renderList();
}

function applyConfig(c) {
  const bg = c.background_color || defaultConfig.background_color;
  const sf = c.surface_color || defaultConfig.surface_color;
  const tx = c.text_color || defaultConfig.text_color;
  const pr = c.primary_color || defaultConfig.primary_color;
  const sc = c.secondary_color || defaultConfig.secondary_color;
  const ff = (c.font_family || defaultConfig.font_family) + ', sans-serif';
  const fs = c.font_size || defaultConfig.font_size;

  document.getElementById('app-wrapper').style.backgroundColor = bg;
  document.getElementById('header').style.backgroundImage = `linear-gradient(to right, ${pr}, ${pr}dd)`;
  document.getElementById('header-title').textContent = c.app_title || defaultConfig.app_title;
  document.getElementById('header-title').style.color = sf;
  document.getElementById('header-title').style.fontFamily = ff;
  document.getElementById('header-title').style.fontSize = (fs * 1.4) + 'px';
  document.getElementById('fab-btn').style.backgroundImage = `linear-gradient(to bottom right, ${pr}, ${pr}cc)`;

  document.querySelectorAll('.report-card').forEach(card => {
    card.style.backgroundColor = sf;
    card.style.color = tx;
    card.style.fontFamily = ff;
    card.style.fontSize = fs + 'px';
  });
  document.querySelectorAll('.report-meta').forEach(el => { el.style.color = sc; });
  document.querySelectorAll('.del-btn').forEach(el => { el.style.color = sc; });

  const submitBtn = document.getElementById('submit-btn');
  if (submitBtn) submitBtn.style.backgroundImage = `linear-gradient(to right, ${pr}, ${pr}cc)`;
}

// Element SDK
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => { applyConfig(config); },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: v => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
      { get: () => config.surface_color || defaultConfig.surface_color, set: v => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
      { get: () => config.text_color || defaultConfig.text_color, set: v => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
      { get: () => config.primary_color || defaultConfig.primary_color, set: v => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
      { get: () => config.secondary_color || defaultConfig.secondary_color, set: v => { config.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); } }
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: v => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: v => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
  }),
  mapToEditPanelValues: (config) => new Map([
    ['app_title', config.app_title || defaultConfig.app_title]
  ])
});

// Image handling
document.getElementById('f-image').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(evt) {
    selectedImageData = evt.target.result;
    const preview = document.getElementById('image-preview');
    document.getElementById('preview-img').src = selectedImageData;
    preview.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
});

function clearImage() {
  selectedImageData = null;
  document.getElementById('f-image').value = '';
  document.getElementById('image-preview').classList.add('hidden');
}

function renderList() {
  const list = document.getElementById('list');
  const existing = new Map([...list.children].map(el => [el.dataset.id, el]));
  const sorted = [...allReports].sort((a, b) => (b.time || '').localeCompare(a.time || ''));
  const ids = new Set(sorted.map((_, i) => i));

  // Remove deleted
  existing.forEach((el, id) => { if (!ids.has(parseInt(id))) el.remove(); });

  if (sorted.length === 0) {
    list.innerHTML = `<div class="text-center text-slate-400 mt-20 py-8">
     <div class="text-6xl mb-3 opacity-50">📋</div>
     <p class="text-sm font-medium">Belum ada laporan</p>
     <p class="text-xs mt-1 opacity-75">Mulai dengan menambahkan laporan baru</p>
    </div>`;
    return;
  }

  let prev = null;
  sorted.forEach((r, idx) => {
    let el = existing.get(idx.toString());
    if (el) {
      updateCard(el, r, idx);
    } else {
      el = createCard(r, idx);
      list.insertBefore(el, prev ? prev.nextSibling : list.firstChild);
    }
    prev = el;
  });

  if (window.elementSdk && window.elementSdk.config) applyConfig(window.elementSdk.config);
}

function createCard(r, idx) {
  const div = document.createElement('div');
  div.className = 'report-card card-anim bg-white p-5 rounded-2xl shadow-md hover:shadow-xl transition-shadow border-2 border-slate-200';
  div.dataset.id = idx;
  updateCard(div, r, idx);
  return div;
}

function updateCard(div, r, idx) {
  const icon = categoryIcons[r.category] || '📌';
  let imageHtml = '';
  if (r.image) {
    imageHtml = `<img src="${r.image}" class="w-full h-40 object-cover rounded-2xl mt-3 mb-3 shadow-md border-2 border-slate-100">`;
  }
  
  div.innerHTML = `
    <div class="flex items-start justify-between gap-3">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xs px-3.5 py-1.5 rounded-full bg-gradient-to-r from-red-100 to-orange-100 text-red-700 font-bold shrink-0 border-2 border-red-200 shadow-sm">${icon} ${r.category || ''}</span>
        </div>
        <h3 class="font-bold text-base text-slate-900 break-words">${esc(r.title)}</h3>
        <p class="text-sm text-slate-600 mt-2 line-clamp-2 leading-relaxed">${esc(r.desc)}</p>
        ${imageHtml}
        <div class="report-meta flex items-center gap-3 mt-3 text-xs text-slate-500 flex-wrap font-medium">
          ${r.location ? `<span class="flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-red-500"></i> ${esc(r.location)}</span>` : ''}
          <span class="flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5 text-orange-500"></i> ${formatTime(r.time)}</span>
        </div>
      </div>
      <button class="del-btn shrink-0 w-9 h-9 rounded-full bg-red-50 flex items-center justify-center border-none text-slate-400 hover:bg-red-500 hover:text-white transition" onclick="requestDelete(${idx})">
        <i data-lucide="trash-2" class="w-4.5 h-4.5"></i>
      </button>
    </div>`;
  lucide.createIcons();
}

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function formatTime(t) {
  if (!t) return '';
  try { const d = new Date(t); return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) + ' ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); } catch { return t; }
}

function openPopup() {
  document.getElementById('popup').classList.add('active');
  document.getElementById('overlay').classList.remove('hidden');
  lucide.createIcons();
}

function closePopup() {
  document.getElementById('popup').classList.remove('active');
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('form-error').classList.add('hidden');
}

function getLocation() {
  if (!navigator.geolocation) { showToast('❌ Geolokasi tidak didukung'); return; }
  const locInput = document.getElementById('f-loc');
  locInput.value = 'Mencari lokasi...';
  navigator.geolocation.getCurrentPosition(
    p => { locInput.value = `${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`; showToast('📍 Lokasi diterima'); },
    () => { locInput.value = ''; showToast('❌ Gagal mendapatkan lokasi'); }
  );
}

async function addReport() {
  const title = document.getElementById('f-title').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const loc = document.getElementById('f-loc').value.trim();
  const cat = document.getElementById('f-cat').value;
  const errEl = document.getElementById('form-error');
  const errorText = document.getElementById('error-text');
  const btn = document.getElementById('submit-btn');

  if (!title || !desc) {
    errorText.textContent = 'Judul dan deskripsi wajib diisi.';
    errEl.classList.remove('hidden');
    return;
  }

  if (allReports.length >= 999) {
    errorText.textContent = 'Batas maksimum 999 laporan tercapai.';
    errEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span> Mengirim...';

  // Simulate async operation
  await new Promise(resolve => setTimeout(resolve, 300));

  allReports.push({
    title, desc, location: loc, category: cat, time: new Date().toISOString(), image: selectedImageData
  });

  saveToLocalStorage();
  renderList();

  btn.disabled = false;
  btn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Kirim Laporan';
  lucide.createIcons();

  document.getElementById('f-title').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-loc').value = '';
  clearImage();
  closePopup();
  showToast('✓ Laporan terkirim!');
}

function requestDelete(idx) {
  deleteTarget = idx;
  if (deleteTarget !== null) {
    document.getElementById('delete-modal').classList.remove('hidden');
    lucide.createIcons();
  }
}

function cancelDelete() {
  deleteTarget = null;
  document.getElementById('delete-modal').classList.add('hidden');
}

async function confirmDelete() {
  if (deleteTarget === null) return;
  const btn = document.getElementById('confirm-del-btn');
  btn.disabled = true;
  btn.textContent = '...';
  
  // Simulate async operation
  await new Promise(resolve => setTimeout(resolve, 300));
  
  allReports.splice(deleteTarget, 1);
  saveToLocalStorage();
  renderList();
  
  btn.disabled = false;
  btn.textContent = 'Hapus';
  document.getElementById('delete-modal').classList.add('hidden');
  showToast('✓ Laporan dihapus');
  deleteTarget = null;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  const parts = msg.split(' ');
  document.getElementById('toast-icon').textContent = parts[0];
  document.getElementById('toast-text').textContent = parts.slice(1).join(' ');
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

// Initialize
loadFromLocalStorage();
lucide.createIcons();
  </script>
